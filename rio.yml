      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"

