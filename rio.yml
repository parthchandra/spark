schemaVersion: 2.0
 
users:
  - vishwa
  - paramasi
 
notificationRecipients:
  - vishwa@apple.com
  - thiru@apple.com
 
builds:
  - branchName: pie-spark-1.5.2
    timeout: 35
    junitReports: false
    machine:
      java:
        version: 1.8
      maven:
        version: maven-3.3
      env:
        MAVEN_OPTS: "-DskipTests=true -Dscala.version=2.11.7 -Dscala.binary.version=2.11 -Dhadoop.version=2.6.0-mr1-cdh5.6.0"
        skipTests: true
        skipFunctionalTest: true
    build:
      template: maven:v2:lib:release
