        - build/sbt -Phadoop-3.2 -Phive "hive/test-only *.HiveExternalCatalogVersionsSuite" "hive/test-only *.HiveSparkSubmitSuite" "hive/test-only *.VersionsSuite" "hive/test-only *.Hive_2_1_DDLSuite" "hive/test-only *.HiveSerDeSuite" "hive/test-only *.HiveQuerySuite"

