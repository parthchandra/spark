  - name: pie-spark-2.10_1.5.2-snapshot
    branchName: pie-spark-1.5.2
    timeout: 90
    build:
      template: freestyle:v1:snapshot
      steps: 
        - ./rio-maven-custom-build.sh --scala 2.10 --hadoop "2.6.0-mr1-cdh5.6.0" --snapshot --maven-opts "-Xmx4g -XX:MaxPermSize=1g -XX:ReservedCodeCacheSize=1g"
    trigger:
      gitPush: false
      scm: '@hourly'
    publish:
      reports:
        junit: false
    finally:
      tag:
        expression: "snapshots_2.10/$CODE_VERSION-$RIO_BUILD_NUMBER"

  - name: pie-spark-2.10_1.5.2-release
    branchName: pie-spark-1.5.2
    timeout: 90
    build:
      template: freestyle:v1:release
    trigger:
      gitPush: false
    publish:
      reports:
        junit: false
    finally:
      tag:
        expression: "releases_2.10/$CODE_VERSION"

  - name: pie-spark-2.11_1.5.2-slug
    branchName: pie-spark-1.5.2
    timeout: 90
    machine:
      env:
    build:
      template: freestyle:v1:slug
      steps:
        - ./make-distribution.sh --tgz --skip-java-test -DskipTests=true -Dscala-2.11=enabled -Dhive-thriftserver=enabled -Dscala.version=2.11.7 -Dscala.binary.version=2.11 -Dhadoop.version=2.6.0-mr1-cdh5.6.0
    trigger:
      gitPush: false
    publish: 
      archives:
        targetPath: com/apple/pie/spark/distribution/2.11/1.5.2-pie1.0.2/
    finally:
      tag:
        expression: "slug/$CODE_VERSION"
