schemaVersion: 2.0

machine:
  maven:
    version: maven-3.3

builds:
  - name: pie-spark-2.11_2.4.4-jdk8-prb
    branchName: pie-spark-2.4.4-jdk11
    timeout: 180
    machine:
      baseImage: docker.apple.com/cpbuild/jdk1.8:latest
      env:
        SCALA_BINARY_VERSION: 2.11
        HADOOP_BINARY_VERSION: 2.7
        PUBLISH_JARS: false
    build:
      template: freestyle:v4:prb
      steps:
        - java -version
        - ./dev/rio-maven-custom-build.sh --do-not-skip-tests --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "" --maven-params "-P hive,scala-${SCALA_BINARY_VERSION},hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos --fail-at-end"

  - name: pie-spark-2.11_2.4.4-openjdk11-prb
    branchName: pie-spark-2.4.4-jdk11
    timeout: 180
    machine:
      baseImage: docker.apple.com/cpbuild/openjdk11:latest
      env:
        SCALA_BINARY_VERSION: 2.11
        HADOOP_BINARY_VERSION: 2.7
        PUBLISH_JARS: false
    build:
      template: freestyle:v4:prb
      steps:
        - java -version
        - ./dev/rio-maven-custom-build.sh --do-not-skip-tests --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "" --maven-params "-P hive,scala-${SCALA_BINARY_VERSION},hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos --fail-at-end"

  - name: pie-spark-2.11_2.4.4-jdk8-no-tests-prb
    branchName: pie-spark-2.4.4-jdk11
    timeout: 180
    machine:
      baseImage: docker.apple.com/cpbuild/jdk1.8:latest
      env:
        SCALA_BINARY_VERSION: 2.11
        HADOOP_BINARY_VERSION: 2.7
        PUBLISH_JARS: false
    build:
      template: freestyle:v4:prb
      steps:
        - java -version
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "" --maven-params "-P hive,scala-${SCALA_BINARY_VERSION},hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos --fail-at-end"

  - name: pie-spark-2.11_2.4.4-openjdk11-no-tests-prb
    branchName: pie-spark-2.4.4-jdk11
    timeout: 180
    machine:
      baseImage: docker.apple.com/cpbuild/openjdk11:latest
      env:
        SCALA_BINARY_VERSION: 2.11
        HADOOP_BINARY_VERSION: 2.7
        PUBLISH_JARS: false
    build:
      template: freestyle:v4:prb
      steps:
        - java -version
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "" --maven-params "-P hive,scala-${SCALA_BINARY_VERSION},hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos --fail-at-end"

