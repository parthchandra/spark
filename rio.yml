  - name: pie-spark-2.11_2.4.4-jdk11-snapshot
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --hadoop "$HADOOP_VERSION" --snapshot --maven-opts "-Xmx6g" --maven-params "-P hive,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos,yarn,kubernetes"
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-${HADOOP_BINARY_VERSION} -Dhadoop.version="$HADOOP_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false

  - name: pie-spark-2.12_2.4.4-jdk11-snapshot
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      env:
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.10"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - sed -i 's/scala\.version>[0-9.]*/scala\.version>2.12.10/' pom.xml
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --hadoop "$HADOOP_VERSION" --snapshot --maven-opts "-Xmx6g" --maven-params "-Dscala.version=$SCALA_VERSION -P scala-${SCALA_BINARY_VERSION},hive,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos,yarn,kubernetes"
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Pscala-$SCALA_BINARY_VERSION -Phadoop-${HADOOP_BINARY_VERSION} -Dhadoop.version="$HADOOP_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false

  - name: pie-spark-2.11_2.4.4-jdk11-release
    branchName: pie-spark-2.4.4-jdk11-release
    timeout: 90
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
