        SCALA_VERSION: "2.12.10"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: false
    build:
      template: freestyle:v4:publish
      steps:
        - sed -i 's/<scala\.version>[0-9.]*/<scala\.version>2.12.10/' pom.xml
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --release --maven-opts "" --maven-params "-Dscala.version=$SCALA_VERSION -P scala-${SCALA_BINARY_VERSION},hadoop-provided,mesos,yarn,kubernetes"
        - ./dev/make-distribution.sh --tgz --use-existing-build --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Pscala-$SCALA_BINARY_VERSION
        - ci stage-lib ".dist/local-repo/**/*.tgz"
    package:
      release: true
      freeform:
      - publish:
        - repo: oss-patched-binaries-local

