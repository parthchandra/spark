    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 -Pkubernetes "kubernetes/test"

  - name: pie-spark-2.11_2.4.4-snapshot-python27
    branchName: pie-spark-2.4.4
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - curl "https://bootstrap.pypa.io/get-pip.py" -o "get-pip.py"
        - python get-pip.py
        - pip2.7 install -r python/requirements_python2.txt
        - build/sbt -Phadoop-3.2 -Pflume assembly/package streaming-flume-assembly/assembly test:package
        - python/run-tests.py --python-executables python2.7

  - name: pie-spark-2.11_2.4.4-snapshot-python36
    branchName: pie-spark-2.4.4
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - yum install -y python3
        - pip3.6 install -r python/requirements_python3.txt
        - build/sbt -Phadoop-3.2 -Pflume assembly/package streaming-flume-assembly/assembly test:package
        - python/run-tests.py --python-executables python3.6

  - name: pie-spark-2.11_2.4.4-snapshot
    branchName: pie-spark-2.4.4
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        # The following is tested and parellized.
        # - mvn -Phadoop-3.2 -Phadoop-cloud -Pyarn -Pmesos -Pkubernetes -Phive -Phive-thriftserver -Djava.version=11 -DskipTests package
        # - mvn -Phadoop-3.2 -Phadoop-cloud -Pyarn -Pmesos -Pkubernetes -Phive -Phive-thriftserver -Djava.version=11 test
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --hadoop "$HADOOP_VERSION" --snapshot --maven-opts "-Xmx6g" --maven-params "-P hive,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos"
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-3.2 -Dhadoop.version="$HADOOP_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false

  - name: pie-spark-2.11_2.4.4-release
    branchName: pie-spark-2.4.4-release
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 90
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
        TAG_NAME: $(./dev/tag-name.sh)
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:release
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --hadoop "$HADOOP_VERSION" --release --maven-opts ""
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-${HADOOP_BINARY_VERSION} -Dhadoop.version="$HADOOP_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false
    finally:
      tag:
        enabled: true
        expression: "$TAG_NAME"

  - name: pie-spark-2.11_2.4.4-hadoop-provided-snapshot
    branchName: pie-spark-2.4.4
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: false
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "-Xmx6g" --maven-params "-P hadoop-provided --fail-at-end"
        - ./dev/make-distribution.sh --tgz --use-existing-build --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false

  - name: pie-spark-2.11_2.4.4-hadoop-provided-release
    branchName: pie-spark-2.4.4-release
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 90
    machine:
      env:
        SCALA_BINARY_VERSION: "2.11"
        SCALA_VERSION: "2.11.12"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: false
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:release
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --release --maven-opts "" --maven-params "-P hadoop-provided"
        - ./dev/make-distribution.sh --tgz --use-existing-build --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false
    finally:
      tag:
        enabled: false
