    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 -Pyarn "yarn/test"

  - name: pie-spark-2.11_2.4.4-snapshot-mesos
