        - build/sbt -Phadoop-3.2 -Pkinesis-asl "streaming-kinesis-asl/test"

  - name: apple-spark-2.12_3.0.0-preview-snapshot-yarn-mesos-k8s
    branchName: pie-spark-3.0.0-preview
    timeout: 90
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 -Pyarn -Pmesos -Pkubernetes "yarn/test" "mesos/test" "kubernetes/test"

  - name: apple-spark-2.12_3.0.0-preview-snapshot-python27
    branchName: pie-spark-3.0.0-preview
    timeout: 90
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - curl "https://bootstrap.pypa.io/get-pip.py" -o "get-pip.py"
        - python get-pip.py
        - pip2.7 install numpy==1.16.4 scipy==1.2.2 pandas==0.23.2
        - yum install -y python3 # run-tests.py requires this
        - build/sbt -Phadoop-3.2 test:package
        - python/run-tests.py --python-executables python2.7

  - name: apple-spark-2.12_3.0.0-preview-snapshot-python36
    branchName: pie-spark-3.0.0-preview
    timeout: 90
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - yum install -y python3
        - pip3.6 install numpy==1.16.4 scipy==1.2.2 pandas==1.0.1
        - build/sbt -Phadoop-3.2 test:package
        - python/run-tests.py --python-executables python3.6

  - name: apple-spark-2.12_3.0.0-preview-snapshot
    branchName: pie-spark-3.0.0-preview
    timeout: 90
    machine:
      baseImage: docker.apple.com/cpbuild7/applejdk-11
      env:
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.10"
        HADOOP_BINARY_VERSION: "3.2"
        HADOOP_VERSION: "3.2.0"
        PUBLISH_JARS: true
    build:
      template: freestyle:v4:publish
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --hadoop "$HADOOP_VERSION" --snapshot --maven-opts "-Xmx6g" --maven-params "-P hive,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,mesos,yarn,kubernetes"
        - ./dev/make-distribution.sh --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-${HADOOP_BINARY_VERSION} -Dhadoop.version="$HADOOP_VERSION"
        - ci stage-lib --many-many-artifacts ".dist/local-repo/**/*" --exclude "**/*.xml" --exclude "**/*.md5" --exclude "**/*.sha1" --exclude "**/*.tgz"
    package:
      freeform:
      - publish:
        - repo: m2:oss-patched

  - name: apple-spark-2.12_3.0.0-preview-binaries-snapshot2
