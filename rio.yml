        - ./dev/make-distribution.sh --tgz --use-existing-build --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION"
    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false


  - name: pie-spark-2.11_2.4.3-applejdk11-no-tests-no-hadoop-release
    branchName: pie-spark-2.4.3-jdk11-release
    timeout: 180
    machine:
      java:
        version: 11
      env:
        SCALA_BINARY_VERSION: 2.11
        SCALA_VERSION: "2.11.8"
        PUBLISH_JARS: true
    build:
      template: freestyle:v2:release
      steps:
        - export SPARK_LOCAL_HOSTNAME=localhost
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --release --maven-opts "" --maven-params "-P hive,scala-${SCALA_BINARY_VERSION},hadoop-provided,hive-thriftserver,kinesis-asl,mesos --fail-at-end"
        - ./dev/make-distribution.sh --tgz --use-existing-build --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION"

    publish:
      archives:
        includePattern: .dist/local-repo/**/*.jar, .dist/local-repo/**/*.pom, .dist/local-repo/**/*.tgz, .dist/local-repo/**/*.gz
      reports:
        junit: false
    finally:
      tag:
        enabled: true
        expression: "releases_2.11/$CODE_VERSION"
