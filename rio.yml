schemaVersion: 2.0

notify:
  email:
    enabled: false

machine:
  java:
    version: 11-applejdk

builds:
  - name: apple-spark-2.12_3.0.0-preview-snapshot-common
    branchName: pie-spark-3.0.0-preview
    timeout: 90
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"

  - name: apple-spark-2.12_3.0.0-preview-snapshot-core
    branchName: pie-spark-3.0.0-preview
    timeout: 90
