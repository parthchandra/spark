schemaVersion: 2.0

notify:
  email:
    enabled: false

machine:
  java:
    version: 11-applejdk

builds:
  - name: pie-spark-2.11_2.4.4-jdk11-snapshot-tools
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - build/sbt -Phadoop-3.2 "tools/test"

  - name: pie-spark-2.12_2.4.4-jdk11-snapshot-tools
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        - dev/change-scala-version.sh 2.12
        - build/sbt -Dscala.version=2.12.10 -Pscala-2.12 -Phadoop-3.2 "tools/test"

  - name: pie-spark-2.11_2.4.4-jdk11-snapshot-core
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        # "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"
        # "launcher/test" "core/test"
        - build/mvn -Phadoop-3.2 -pl core -am package

  - name: pie-spark-2.12_2.4.4-jdk11-snapshot-core
    branchName: pie-spark-2.4.4-jdk11
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
    timeout: 600
    machine:
      docker:
        baseImage: docker.apple.com/cpbuild7/applejdk-11
    build:
      template: freestyle:v2:snapshot
      steps:
        # "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"
        # "launcher/test" "core/test"
        - dev/change-scala-version.sh 2.12
        - sed -i 's/scala\.version>[0-9.]*/scala\.version>2.12.10/' pom.xml
        - build/mvn -Dscala.version=2.12.10 -Pscala-2.12 -Phadoop-3.2 -pl core -am package

