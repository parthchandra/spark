        - build/sbt -Phadoop-3.2 -Pmesos "mesos/test"

  - name: pie-spark-2.11_2.4.4-snapshot-kubernetes
    branchName: pie-spark-2.4.4
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 8
